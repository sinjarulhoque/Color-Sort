    <script>
      /* Ensure window.fetch has both getter and setter for extension compatibility */
      try {
        var _origFetch = window.fetch ? window.fetch.bind(window) : null;
        var _curFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() {
            return _curFetch;
          },
          set: function(val) {
            _curFetch = val;
          }
        });
      } catch (e) {}
    </script>
